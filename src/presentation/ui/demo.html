<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Demo - Send Money Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, 'Lucida Grande', Arial, Ubuntu, Cantarell, 'Fira Sans', sans-serif;
            background-color: #111b21;
            color: #e9edef;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ===== PAINEL ESQUERDO ===== */
        .left-panel {
            display: flex;
            width: 30%;
            min-width: 320px;
            max-width: 420px;
            background-color: #111b21;
        }

        /* Barra de navegação vertical */
        .nav-sidebar {
            width: 72px;
            background-color: #202c33;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8696a0;
            cursor: pointer;
            border-radius: 50%;
            margin: 4px 0;
            position: relative;
            transition: background-color 0.15s ease;
        }

        .nav-icon:hover {
            background-color: #2a3942;
        }

        .nav-icon.active {
            color: #00a884;
        }

        .nav-icon svg {
            width: 24px;
            height: 24px;
        }

        .nav-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #00a884;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Área de conversas */
        .conversations-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #111b21;
        }

        .conversations-header {
            background-color: #202c33;
            height: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversations-title {
            font-size: 16px;
            font-weight: 600;
            color: #e9edef;
            margin-left: 8px;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .header-icon {
            width: 26px;
            height: 26px;
            color: #8696a0;
            cursor: pointer;
            padding: 8px;
        }

        .search-container {
            padding: 8px 12px;
            margin: 8px 12px;
            position: relative;
        }

        .search-input {
            background-color: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 9px 12px 9px 36px;
            font-size: 14px;
            color: #e9edef;
            width: 100%;
            outline: none;
        }

        .search-input::placeholder {
            color: #8696a0;
        }

        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: #8696a0;
            width: 22px;
            height: 22px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            background-color: #111b21;
        }

        .conversation-item {
            background-color: #111b21;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #313d45;
            min-height: 72px;
            transition: background-color 0.15s ease;
        }

        .conversation-item:hover {
            background-color: #2a3942;
        }

        .conversation-item.active {
            background-color: #202c33;
        }

        .conversation-avatar {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            background-color: #6a7175;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
        }

        .conversation-content {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            font-size: 17px;
            font-weight: 400;
            color: #e9edef;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-preview {
            font-size: 14px;
            color: #8696a0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .conversation-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .conversation-time {
            font-size: 12px;
            color: #8696a0;
            white-space: nowrap;
        }

        .conversation-unread {
            background-color: #00a884;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Scrollbar customizada */
        .conversations-list::-webkit-scrollbar {
            width: 6px;
        }

        .conversations-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversations-list::-webkit-scrollbar-thumb {
            background-color: rgba(84, 101, 111, 0.3);
            border-radius: 3px;
        }

        /* ===== PAINEL DIREITO ===== */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b141a;
            border-left: 1px solid #313d45;
        }

        /* Header do chat */
        .chat-header {
            background-color: #202c33;
            height: 59px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #313d45;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #6a7175;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 500;
            color: #e9edef;
            margin-bottom: 2px;
        }

        .chat-status {
            font-size: 13px;
            color: #8696a0;
        }

        .chat-header-icons {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .chat-header-icon {
            width: 26px;
            height: 26px;
            color: #8696a0;
            cursor: pointer;
        }

        /* Área de mensagens */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: #0b141a;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
        }

        .date-separator {
            align-self: center;
            background-color: #182229;
            padding: 5px 12px;
            border-radius: 7.5px;
            font-size: 12.5px;
            color: #8696a0;
            margin: 8px 0;
        }

        .message {
            max-width: 65%;
            padding: 6px 7px 8px 9px;
            border-radius: 7.5px;
            margin-bottom: 2px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background-color: #005c4b;
        }

        .message.received {
            align-self: flex-start;
            background-color: #202c33;
        }

        .message-text {
            font-size: 14.2px;
            line-height: 19px;
            color: #e9edef;
        }

        .message-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 2px;
            gap: 4px;
        }

        .message-time {
            font-size: 11px;
            color: rgba(153, 190, 183, 0.7);
        }

        .message.received .message-time {
            color: rgba(134, 150, 160, 0.7);
        }

        .message-status {
            width: 16px;
            height: 16px;
            color: rgba(153, 190, 183, 0.7);
        }

        .message-status.delivered {
            color: #53bdeb;
        }

        .message-status.read {
            color: #8696a0;
        }

        .message.error {
            background-color: #5f3a3a;
            border: 1px solid #7a4a4a;
        }

        .message.loading {
            opacity: 0.7;
        }

        /* Scrollbar customizada para mensagens */
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background-color: rgba(84, 101, 111, 0.3);
            border-radius: 3px;
        }

        /* Input area */
        .access-code-container {
            background-color: #202c33;
            padding: 8px 16px;
            border-bottom: 1px solid #313d45;
        }

        .access-code-input {
            width: 100%;
            background-color: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            color: #e9edef;
            outline: none;
        }

        .access-code-input::placeholder {
            color: #8696a0;
        }

        .input-area {
            background-color: #202c33;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 62px;
        }

        .input-icon {
            width: 40px;
            height: 40px;
            color: #8696a0;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
        }

        .message-input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            border-radius: 21px;
            padding: 9px 12px;
            font-size: 15px;
            color: #e9edef;
            outline: none;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            overflow-y: auto;
        }

        .message-input::placeholder {
            color: #8696a0;
        }

        .message-input:focus {
            outline: none;
        }

        /* Loading indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #8696a0;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* Responsive (opcional) */
        @media (max-width: 768px) {
            .left-panel {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // Configuração
        const API_BASE_URL = window.location.origin;
        const DEMO_SEND_ENDPOINT = `${API_BASE_URL}/demo/send`;
        let currentPhoneNumber = "+5511999999999";
        let isLoading = false;

        // Elementos DOM
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const accessCodeInput = document.getElementById('accessCodeInput');
        const sendButton = document.getElementById('sendButton');
        const dateSeparator = document.getElementById('dateSeparator');
        const lastMessageTime = document.getElementById('lastMessageTime');

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            updateDateSeparator();
            setupEventListeners();
            loadWelcomeMessage();
        });

        // Atualizar separador de data
        function updateDateSeparator() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('en-US', options);
            dateSeparator.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        // Configurar event listeners
        function setupEventListeners() {
            // Enviar mensagem com Enter
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Auto-resize textarea
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
            });

            // Botão de enviar
            sendButton.addEventListener('click', sendMessage);
        }

        // Mensagem de boas-vindas
        function loadWelcomeMessage() {
            const welcomeText = "Hello! I'm the payment agent. How can I help you today?";
            addMessageToUI(welcomeText, 'received', new Date());
        }

        // Enviar mensagem
        async function sendMessage() {
            const messageText = messageInput.value.trim();
            const accessCode = accessCodeInput.value.trim();
            
            if (!messageText || isLoading) {
                return;
            }

            if (!accessCode) {
                showErrorMessage('Please enter access code');
                return;
            }

            // Limpar input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Adicionar mensagem enviada à UI
            addMessageToUI(messageText, 'sent', new Date());
            updateLastMessageTime();

            // Mostrar indicador de digitação
            showTypingIndicator();

            try {
                isLoading = true;
                sendButton.style.opacity = '0.5';
                sendButton.style.cursor = 'not-allowed';

                // Montar payload (sem criptografia no JS)
                const payload = {
                    from_number: currentPhoneNumber,
                    message: messageText,
                    message_id: null,
                    timestamp: new Date().toISOString()
                };

                // Enviar para /demo/send com payload e access_code
                const response = await fetch(DEMO_SEND_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Incluir cookies (session_id)
                    body: JSON.stringify({
                        payload: payload,
                        access_code: accessCode
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `Error ${response.status}`);
                }

                const data = await response.json();
                
                // Remover indicador de digitação
                hideTypingIndicator();

                // Adicionar resposta do agente
                addMessageToUI(data.message, 'received', new Date());
                updateLastMessageTime();

            } catch (error) {
                console.error('Error sending message:', error);
                hideTypingIndicator();
                showErrorMessage(error.message || 'Error sending message. Please try again.');
            } finally {
                isLoading = false;
                sendButton.style.opacity = '1';
                sendButton.style.cursor = 'pointer';
            }
        }

        // Adicionar mensagem à UI
        function addMessageToUI(text, type, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = text;

            const footerDiv = document.createElement('div');
            footerDiv.className = 'message-footer';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = formatTime(timestamp);

            footerDiv.appendChild(timeSpan);

            if (type === 'sent') {
                const statusSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                statusSvg.setAttribute('class', 'message-status delivered');
                statusSvg.setAttribute('viewBox', '0 0 16 16');
                statusSvg.setAttribute('width', '16');
                statusSvg.setAttribute('height', '16');
                statusSvg.setAttribute('fill', 'currentColor');
                statusSvg.innerHTML = '<path d="M15.854 2.146a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L8.5 9.293l6.646-6.647a.5.5 0 0 1 .708 0z"/><path d="M15.854 2.146a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L8.5 9.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>';
                footerDiv.appendChild(statusSvg);
            }

            messageDiv.appendChild(textDiv);
            messageDiv.appendChild(footerDiv);
            messagesArea.appendChild(messageDiv);

            scrollToBottom();
        }

        // Mostrar indicador de digitação
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message received typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            messagesArea.appendChild(typingDiv);
            scrollToBottom();
        }

        // Esconder indicador de digitação
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Mostrar mensagem de erro
        function showErrorMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message sent error';
            messageDiv.innerHTML = `
                <div class="message-text">❌ ${text}</div>
                <div class="message-footer">
                    <span class="message-time">${formatTime(new Date())}</span>
                </div>
            `;
            messagesArea.appendChild(messageDiv);
            scrollToBottom();
        }

        // Formatar hora
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // Atualizar última mensagem no preview
        function updateLastMessageTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            lastMessageTime.textContent = `${hours}:${minutes}`;
        }

        // Scroll automático para o final
        function scrollToBottom() {
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 100);
        }
    </script>
</body>
</html>
